<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мега Чат Приложение</title>
    <script src="https://telegram.org"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #18222d);
            color: var(--tg-theme-text-color, #ffffff);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        .header {
            background-color: var(--tg-theme-secondary-bg-color, #212d3b);
            padding: 15px;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        .content {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: none;
        }
        .content.active {
            display: block;
        }
        .chat-container {
            display: flex;
            flex-direction: column;
            height: 100%;
        }
        .input-area {
            display: flex;
            gap: 8px;
            margin-top: auto;
            padding-bottom: 20px;
        }
        .chat-input {
            flex: 1;
            background-color: var(--tg-theme-secondary-bg-color, #212d3b);
            color: var(--tg-theme-text-color, #ffffff);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 12px;
            border-radius: 8px;
            outline: none;
            font-size: 16px;
        }
        .profile-card {
            background-color: var(--tg-theme-secondary-bg-color, #212d3b);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            margin-top: 10px;
        }
        .profile-avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background-color: #5288c1;
            margin: 0 auto 15px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            font-weight: bold;
        }
        .btn-action {
            background-color: var(--tg-theme-button-color, #5288c1);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
        }
        .nav-bar {
            display: flex;
            background-color: var(--tg-theme-secondary-bg-color, #212d3b);
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            padding-bottom: max(10px, env(safe-area-inset-bottom));
        }
        .nav-item {
            flex: 1;
            text-align: center;
            padding: 12px 5px;
            font-size: 12px;
            cursor: pointer;
            color: var(--tg-theme-hint-color, #708499);
        }
        .nav-item.active {
            color: var(--tg-theme-button-color, #5288c1);
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="header" id="app-title">🌐 Общий чат</div>

    <!-- ВКЛАДКА 1: ЧАТ -->
    <div id="tab-global" class="content active">
        <div class="chat-container">
            <p style="color: var(--tg-theme-hint-color); text-align: center; margin-top: 40px;">
                💬 Напишите сообщение ниже. Оно мгновенно отправится в общий чат бота!
            </p>
            <div class="input-area">
                <input type="text" class="chat-input" id="msg-field" placeholder="Введите текст...">
                <button class="btn-action" style="width: auto; padding: 0 20px;" onclick="sendMessageToBot()">Отправить</button>
            </div>
        </div>
    </div>

    <!-- ВКЛАДКА 2: ПРОФИЛЬ -->
    <div id="tab-profile" class="content">
        <div class="profile-card">
            <div class="profile-avatar" id="u-avatar">?</div>
            <h2 style="margin: 0 0 5px 0;" id="u-name">Пользователь</h2>
            <p style="color: var(--tg-theme-hint-color); margin: 0 0 15px 0;" id="u-id">ID: 00000000</p>
            <p style="font-size: 14px; color: var(--tg-theme-hint-color);">
                💡 Настройки никнейма и списки друзей доступны через стандартные нижние кнопки в самом чате бота.
            </p>
        </div>
    </div>

    <!-- НИЖНЕЕ МЕНЮ -->
    <div class="nav-bar">
        <div class="nav-bar">
            <div class="nav-item active" onclick="switchTab('global', '🌐 Общий чат', this)">
                <div>🌐 Чат</div>
            </div>
            <div class="nav-item" onclick="switchTab('profile', '👤 Профиль', this)">
                <div>👤 Профиль</div>
            </div>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        function parseAndLoadUserData() {
            // Способ 1: Прямое чтение объекта
            let user = tg.initDataUnsafe ? tg.initDataUnsafe.user : null;

            // Способ 2: Декодирование зашифрованной строки initData (для Кнопки Меню)
            if (!user && tg.initData) {
                try {
                    const params = new URLSearchParams(tg.initData);
                    const userParam = params.get('user');
                    if (userParam) user = JSON.parse(userParam);
                } catch (e) {
                    console.error("Ошибка расшифровки данных:", e);
                }
            }

            // Выводим данные на экран
            if (user) {
                const fullName = user.first_name + (user.last_name ? ' ' + user.last_name : '');
                document.getElementById('u-name').innerText = fullName;
                document.getElementById('u-id').innerText = 'ID: ' + user.id;
                document.getElementById('u-avatar').innerText = user.first_name.charAt(0).toUpperCase();
            }
        }

        function switchTab(tabId, title, element) {
            document.getElementById('app-title').innerText = title;
            document.querySelectorAll('.content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            document.getElementById('tab-' + tabId).classList.add('active');
            element.classList.add('active');
            if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
        }

        function sendMessageToBot() {
            const input = document.getElementById("msg-field");
            const text = input.value.trim();
            if (!text) return;

            const data = {
                source: "web_app_msg",
                text: text
            };

            tg.sendData(JSON.stringify(data));
        }

        document.getElementById("msg-field").addEventListener("keydown", function(e) {
            if (e.key === "Enter") sendMessageToBot();
        });

        // Запускаем сбор данных при открытии
        parseAndLoadUserData();
    </script>
</body>
</html>
